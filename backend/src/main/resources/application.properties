# ---- Database (all values come from the environment; see ../../../../.env.example) ----
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/volunteerhub}
spring.datasource.username=${DB_USERNAME:volunteerhub}
spring.datasource.password=${DB_PASSWORD}

# Schema is owned by Flyway (src/main/resources/db/migration). Hibernate must not alter it.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.flyway.enabled=true
# Existing databases created by the old Hibernate "update" setup are adopted at version 1.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

server.port=8080
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never

# Accept "Volunteer" / "volunteer" / "VOLUNTEER" for enums (the original UI sent "Volunteer")
spring.jackson.mapper.accept-case-insensitive-enums=true

# ---- JWT (secret has NO default on purpose: the app refuses to start without it) ----
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration=${JWT_EXPIRATION:1h}

# ---- CORS: comma separated list of allowed browser origins ----
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}

# ---- Optional first-admin bootstrap (see README). Leave unset after the admin exists. ----
app.bootstrap-admin.email=${BOOTSTRAP_ADMIN_EMAIL:}
app.bootstrap-admin.password=${BOOTSTRAP_ADMIN_PASSWORD:}
app.bootstrap-admin.name=${BOOTSTRAP_ADMIN_NAME:Administrator}
