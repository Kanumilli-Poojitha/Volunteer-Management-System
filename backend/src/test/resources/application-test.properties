# Test-only configuration: in-memory H2 (MySQL mode), no Flyway, no real database touched.
spring.datasource.url=jdbc:h2:mem:volunteerhub_test;MODE=MySQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.flyway.enabled=false
# TEST-ONLY value, not a real secret
app.jwt.secret=test-only-secret-test-only-secret-0123456789
app.jwt.expiration=1h
app.cors.allowed-origins=http://localhost:3000
